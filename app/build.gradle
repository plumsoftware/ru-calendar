plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk = 37
    namespace = 'com.plumsoftware.rucalendar'

    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")

    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
    }

    defaultConfig {
        applicationId = "com.plumsoftware.rucalendar"
        minSdk = 21
        targetSdk = 37
        versionCode = 71
        versionName = "5.0.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true

        // Реклама Яндекса (РСЯ). Флаг false — реклама этого вида даже не загружается.
        // Реклама при открытии приложения
        buildConfigField "boolean", "SHOW_APP_OPEN_AD", "false"
        // Баннер на главной странице — показывается внизу «Ленты»
        buildConfigField "boolean", "SHOW_FEED_BANNER_AD", "false"
        // Баннер внизу экрана о празднике
        buildConfigField "boolean", "SHOW_EVENT_BANNER_AD", "true"
    }

    flavorDimensions += 'store'
    productFlavors {
        rustore {
            dimension = 'store'
            buildConfigField "int", "PLATFORM", "1"
            buildConfigField "String", "AD_FEED_BANNER_ID", '"R-M-2215793-1"'
            buildConfigField "String", "AD_EVENT_BANNER_ID", '"R-M-2215793-5"'
            buildConfigField "String", "AD_APP_OPEN_ID", '"R-M-2215793-4"'
            buildConfigField "String", "AD_INTERSTITIAL_ID", '"R-M-2215793-2"'
        }
        huawei {
            dimension = 'store'
            buildConfigField "int", "PLATFORM", "2"
            buildConfigField "String", "AD_FEED_BANNER_ID", '"R-M-13730194-1"'
            buildConfigField "String", "AD_EVENT_BANNER_ID", '"R-M-13730194-4"'
            buildConfigField "String", "AD_APP_OPEN_ID", '"R-M-13730194-2"'
            buildConfigField "String", "AD_INTERSTITIAL_ID", '"R-M-13730194-3"'
        }
        googleplay {
            dimension = 'store'
            buildConfigField "int", "PLATFORM", "3"
            buildConfigField "String", "AD_FEED_BANNER_ID", '"R-M-1752331-1"'
            buildConfigField "String", "AD_EVENT_BANNER_ID", '"R-M-1752331-8"'
            buildConfigField "String", "AD_APP_OPEN_ID", '"R-M-1752331-6"'
            buildConfigField "String", "AD_INTERSTITIAL_ID", '"R-M-1752331-7"'
        }
    }

    buildTypes {
        debug {
            // Демо-блоки Яндекса: в debug реклама проверяется без реальных показов
            buildConfigField "String", "AD_FEED_BANNER_ID", '"demo-banner-yandex"'
            buildConfigField "String", "AD_EVENT_BANNER_ID", '"demo-banner-yandex"'
            buildConfigField "String", "AD_APP_OPEN_ID", '"demo-appopenad-yandex"'
            buildConfigField "String", "AD_INTERSTITIAL_ID", '"demo-interstitial-yandex"'
            // В debug баннер «Ленты» включён, чтобы видеть демо; в release флаг из defaultConfig (false)
            buildConfigField "boolean", "SHOW_FEED_BANNER_AD", "true"
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // java.time на minSdk 21
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        buildConfig = true
    }

    // lintOptions удалён в AGP 9 — те же настройки в блоке lint
    lint {
        quiet = true
        abortOnError = false
        // release-сборки проверяют проблемы с severity=fatal
        checkReleaseBuilds = true
        ignoreWarnings = true
        checkAllWarnings = true
        warningsAsErrors = true
        disable += ['TypographyFractions', 'TypographyQuotes', 'MobileAdsSdkOutdatedVersion']
        enable += ['RtlHardcoded', 'RtlCompat', 'RtlEnabled']
        checkOnly += ['NewApi', 'InlinedApi']
        noLines = true
        showAll = true
        explainIssues = false
        lintConfig = file("default-lint.xml")
        textReport = true
        textOutput = file("lint-results.txt")
        xmlReport = true
        xmlOutput = file("lint-report.xml")
        htmlReport = true
        htmlOutput = file("lint-report.html")
        fatal += ['NewApi', 'InlineApi']
        error += ['Wakelock', 'TextViewEdits']
        warning += ['ResourceAsColor']
        informational += ['StopShip']
        baseline = file("lint-baseline.xml")
        checkTestSources = true
        ignoreTestSources = true
        checkGeneratedSources = true
        checkDependencies = false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
    implementation fileTree(include: ['*.jar', '*.libs'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-messaging:23.1.2'
    implementation 'androidx.core:core-ktx:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //Multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    //Calendar
    //implementation 'org.naishadhparmar.zcustomcalendar:zcustomcalendar:1.0.1'


    //noinspection MobileAdsSdkVersion
    implementation 'com.yandex.android:mobileads:8.5.0'

    //Animations
    implementation 'io.noties:tumbleweed-android:2.0.0'

    //Swipe to refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Лента и страницы карточки дня
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    //Messaging service
    implementation platform('com.google.firebase:firebase-bom:30.2.0')
    implementation 'com.google.firebase:firebase-analytics'

    //Lottie
    def lottieVersion = "3.4.0"
    implementation "com.airbnb.android:lottie:$lottieVersion"

    //Worker
    implementation "androidx.work:work-runtime:2.8.1"

    // VK AD
    implementation "com.my.target:mytarget-sdk:5.27.3"

    // Analytics
    implementation 'com.google.firebase:firebase-analytics:23.0.0'

    // AppMetrica SDK
    implementation("io.appmetrica.analytics:analytics:7.14.0")
}