name: Build store release packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RuStore, Google Play and Huawei
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing configuration
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/key_safe.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -f "$ANDROID_KEYSTORE_PATH" || { echo "key_safe.jks not found"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing"; exit 1; }

      - name: Build APKs and AABs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/key_safe.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:assembleRustoreRelease \
            :app:bundleGoogleplayRelease \
            :app:assembleHuaweiRelease

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: ru-calendar-store-releases
          path: |
            app/build/outputs/apk/rustore/release/*.apk
            app/build/outputs/bundle/googleplayRelease/*.aab
            app/build/outputs/apk/huawei/release/*.apk
          if-no-files-found: error
          retention-days: 14
