name: Build store release packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RuStore, Google Play and Huawei
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "Android sdkmanager not found: $SDKMANAGER"; exit 1; }
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Accept every Android SDK license non-interactively.
          # Ignore yes' expected SIGPIPE, but preserve sdkmanager's real exit code.
          set +e
          yes 2>/dev/null | "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Android SDK license acceptance failed (sdkmanager exit code: $LICENSE_STATUS)"
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0"

          # Android SDK publishes API 37 under android-37.0, while AGP 9.2
          # resolves compileSdk = 37 using the android-37 directory name.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37" || { echo "Android SDK platform 37 was not installed correctly"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing configuration
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/key_safe.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -f "$ANDROID_KEYSTORE_PATH" || { echo "key_safe.jks not found"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing"; exit 1; }

      - name: Build APKs and AABs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/key_safe.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:assembleRustoreRelease \
            :app:bundleGoogleplayRelease \
            :app:assembleHuaweiRelease

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: ru-calendar-store-releases
          path: |
            app/build/outputs/apk/rustore/release/*.apk
            app/build/outputs/bundle/googleplayRelease/*.aab
            app/build/outputs/apk/huawei/release/*.apk
          if-no-files-found: error
          retention-days: 14
